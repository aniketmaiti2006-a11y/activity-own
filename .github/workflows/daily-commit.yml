name: Daily Auto Commit

on:
  schedule:
    # Runs automatically every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to trigger it manually anytime from the Actions tab

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Append Current Timestamp
        run: |
          echo "Automated daily commit: $(date)" >> activity_log.txt

      - name: Commit and Push
        run: |
          git config --global user.name "aniketmaiti2006-a11y"
          git config --global user.email "41898282+aniketmaiti2006-a11y@users.noreply.github.com"
          git add activity_log.txt
          git commit -m "chore: automated daily activity update"
          git push
